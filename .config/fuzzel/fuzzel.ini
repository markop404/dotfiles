font=Inter:size=7
dpi-aware=auto
use-bold=no
prompt="   "
placeholder=""
icon-theme=Papirus-Dark
icons-enabled=yes
hide-before-typing=yes
fields=name
filter-desktop=no
match-mode=fzf
sort-result=yes
match-counter=no
show-actions=yes
list-executables-in-path=no
anchor=center
x-margin=0
y-margin=0
lines=8
width=25
tabs=8
horizontal-pad=20
vertical-pad=13
inner-pad=5
image-size-ratio=1.0
line-height=13
letter-spacing=0.2
layer=overlay
exit-on-keyboard-focus-loss=yes
cache=XDG_CACHE_HOME/fuzzel
render-workers=4
match-workers=4

